packages:
  - apps/*
  - packages/*

# These postinstall scripts only fetch or verify a platform binary that pnpm already installs as an
# optional dependency (esbuild via tsx/vitest, unrs-resolver via eslint-config-next). Listing them keeps
# installs quiet while dependency scripts stay opt-in.
ignoredBuiltDependencies:
  - esbuild
  - unrs-resolver
